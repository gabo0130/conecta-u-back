# Actualizaciones de dependencias hacia develop (nunca directo a master):
# - npm: un solo PR semanal con las versiones menores y parches.
#   Las versiones MAYORES se ignoran: pueden romper la app y se actualizan a mano,
#   en una rama propia, cuando el equipo lo decida.
# - Acciones de GitHub: un solo PR mensual.
# Las actualizaciones de SEGURIDAD no se ven afectadas por estas reglas y llegan
# apenas se publican, aunque sean de versión mayor.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-y-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: chore(ci)
