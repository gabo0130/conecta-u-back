# Integración continua del backend: cada PR hacia develop o master debe pasar
# lint, tipos, pruebas unitarias, build y pruebas de integración (Postgres + pgvector
# desechable) antes de poder fusionarse. Los nombres de los jobs (lint-test-build, e2e)
# son los checks obligatorios de la regla del repositorio: no cambiarlos.
name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test-build:
    name: lint-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Sin --fix: en CI solo se reporta.
      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: conecta_u_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d conecta_u_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5433/conecta_u_test
      AI_PROVIDER: fake
      JWT_SECRET: ci-only-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Las pruebas de integración existen desde la Iteración 2; en ramas que aún
      # no las tienen el job pasa sin correr nada (sigue siendo un check obligatorio).
      - name: Setup Node.js
        if: hashFiles('test/jest-e2e.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: hashFiles('test/jest-e2e.json') != ''
        run: npm ci

      - name: Run end-to-end tests
        if: hashFiles('test/jest-e2e.json') != ''
        run: npm run test:e2e -- --runInBand
